name: Release
# Publishes gnss-caster-install.sh and SHA256SUMS for a version tag vX.Y.Z.
# The web updater (System settings -> Updates) and install.sh install exactly
# these files. Two ways to start it, both end with the same published release:
#   - push a tag:      git tag v3.5.0 && git push origin v3.5.0
#   - on github.com:   Releases -> Draft a new release -> create tag v3.5.0 -> Publish
# The tag must point to a commit on main whose installer, frontend/package.json
# and CHANGES.md all name the same version; all checks run again before publishing.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Tag must be vX.Y.Z on main and match the sources
        env:
          TAG: ${{ github.ref_name }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Release tags must look like v3.5.0, got $TAG"; exit 1 ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG points to $GITHUB_SHA, which is not on main. Release only reviewed commits from main."
            exit 1
          fi
          python tools/prepare_release.py "${TAG#v}"

  checks:
    needs: verify
    uses: ./.github/workflows/checks.yml

  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Build release files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python tools/prepare_release.py "${TAG#v}"
          bash -n gnss-caster-install.sh
          cat SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: python tools/publish_release.py "$TAG" "$GITHUB_REPOSITORY"
