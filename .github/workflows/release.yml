name: Prepare stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version matching the installer, for example 3.3.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-stable-release
  cancel-in-progress: false

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml

  draft:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate version and prepare release notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python tools/prepare_release.py "$RELEASE_VERSION"
      - name: Create draft with the checked installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh release create "v$RELEASE_VERSION" \
            --target "$RELEASE_COMMIT" --draft \
            --title "GNSS Caster $RELEASE_VERSION" \
            --notes-file release-notes.md \
            gnss-caster-install.sh SHA256SUMS
