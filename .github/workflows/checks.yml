name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check installer syntax
        run: |
          bash -n gnss-caster-install.sh
          python tools/embed_release_updater.py --check
          python tools/embed_recovery.py --check
      - name: Run backend and installer regressions
        run: python -m unittest discover -s tests -v

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pnpm and test dependencies
        run: |
          npm install --global pnpm@11.25.0
          python -m pip install -r requirements-dev.txt
      - name: Install locked frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build web assets
        working-directory: frontend
        run: pnpm run build
      - name: Verify installer packaging of the build
        run: |
          python tools/embed_frontend.py --check
          python -m unittest discover -s tests -p test_frontend_bundle.py -v
      - name: Test request handling
        working-directory: frontend
        run: pnpm test
      - name: Install Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Test cabinet in browser
        working-directory: frontend
        run: pnpm run test:browser
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-evidence
          path: |
            validation/ui/*.png
            validation/ui/browser-results/
          retention-days: 14
